    // Determine correct relative path depending on whether opened via file:// or http://
    function getAudioUrl(filename) {
      const loc = window.location;
      if (loc.protocol === 'file:') {
        // If opened from deck-and-tackle/public/
        if (loc.pathname.includes('/public/') || loc.pathname.includes('\\public\\')) {
          return './audio/isolated_sfx/' + filename;
        }
        // If opened inside isolated_sfx folder
        if (loc.pathname.includes('isolated_sfx')) {
          return './' + filename;
        }
        // Default relative
        return './audio/isolated_sfx/' + filename;
      }
      // Dev server or web root
      return '/audio/isolated_sfx/' + filename;
    }

    function renderSoundboard() {
      const board = document.getElementById('soundboard');
      board.innerHTML = '';

      const categories = {};
      SOUND_MANIFEST.forEach(item => {
        if (!categories[item.category]) categories[item.category] = [];
        categories[item.category].push(item);
      });

      const categoryIcons = {
        "Resonant Bells & Chimes": "🔔",
        "Sub-Bass & Heavy Impacts": "💥",
        "Creature Groans & Abyssal Rumbles": "🐙",
        "Mechanical & Tension Transients": "⚙️",
        "Eldritch Horns & Shrieks": "📯",
        "Nautical Machinery & Engine Loops": "🚢"
      };

      for (const [catName, sounds] of Object.entries(categories)) {
        const section = document.createElement('div');
        section.className = 'category-section';

        const icon = categoryIcons[catName] || "🔊";
        section.innerHTML = `
          <div class="category-title">
            <div class="title-left">
              <span>${icon} ${catName}</span>
              <span class="badge">${sounds.length} Sounds</span>
            </div>
          </div>
          <div class="sound-grid"></div>
        `;

        const grid = section.querySelector('.sound-grid');

        sounds.forEach(snd => {
          const card = document.createElement('div');
          card.className = 'sound-card';
          const audioSrc = getAudioUrl(snd.filename);
          const mp3Filename = snd.filename.replace('.wav', '.mp3');
          const mp3Src = getAudioUrl(mp3Filename);

          card.innerHTML = `
            <div class="sound-header">
              <span class="sound-name">${snd.name}</span>
              <span class="sound-meta">${snd.duration}s | ${snd.peak_freq_hz}Hz</span>
            </div>
            <div class="sound-desc">${snd.description}</div>
            <audio class="native-audio" controls preload="metadata">
              <source src="${mp3Src}" type="audio/mpeg">
              <source src="${audioSrc}" type="audio/wav">
              Your browser does not support audio playback.
            </audio>
            <div class="sound-footer">
              <span>Time: ${snd.time_range}</span>
              <span>${snd.source}</span>
            </div>
          `;

          grid.appendChild(card);
        });

        board.appendChild(section);
      }
    }

    // Render immediately on DOM ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', renderSoundboard);
    } else {
      renderSoundboard();
    }
